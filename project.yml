name: ImeTime
options:
  bundleIdPrefix: com.zenwang
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

packages:
  ImeTimeCore:
    path: Packages/ImeTimeCore
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: 2.0.0

targets:
  ImeTime:
    type: application
    platform: iOS
    sources:
      - path: ImeTime
    dependencies:
      - package: ImeTimeCore
        product: ImeTimeCore
      - package: Supabase
        product: Supabase
    info:
      path: ImeTime/Info.plist
      properties:
        CFBundleDisplayName: ImeTime
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: ImeTime 需要相機來拍攝 2 秒片段與頭像。
        NSMicrophoneUsageDescription: ImeTime 需要麥克風來錄製片段聲音。
        NSPhotoLibraryAddUsageDescription: ImeTime 需要權限把每日 Vlog 存到你的相簿。
        SupabaseURL: $(SUPABASE_URL)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: ImeTime/ImeTime.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zenwang.imetime
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    scheme:
      testTargets:
        - ImeTimeTests

  ImeTimeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ImeTimeTests
    dependencies:
      - target: ImeTime
      - package: ImeTimeCore
        product: ImeTimeCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
